[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=.
    --cov-report=term-missing
    --cov-report=html:coverage_html
    -v
    -p no:warnings

[coverage:run]
source = .
omit =
    tests/*
    */migrations/*
    */alembic/*
    */monitoring/*
    conftest.py

[coverage:report]
skip_empty = true
show_missing = true
